spring:
  application:
    name: account-statement-generator
  webflux:
    problemdetails:
      enabled: true
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/statements
    username: statements
    password: statements
  datasource:
    url: jdbc:postgresql://localhost:5432/statements
    username: statements
    password: statements
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9094

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.github.dimitryivaniuta.gateway.statement: INFO

statements:
  generator-version: 1.1.0
  kafka:
    topic: statement.generated.v1
  outbox:
    fixed-delay: 5000
  schedule:
    cron: 0 10 2 1 * *
    zone: UTC
